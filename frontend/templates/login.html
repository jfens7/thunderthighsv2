<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | Control Tower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: white; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .glass-panel { background: rgba(10, 17, 34, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-900/20 via-[#090d16] to-[#090d16] p-4">

    <div class="glass-panel w-full max-w-md rounded-3xl p-8 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-purple-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-purple-500/30 mb-4 text-3xl">
                <i class="fa-solid fa-fingerprint text-white"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Admin Control Tower</h1>
            <p class="text-sm text-slate-400 mt-2">Enter your authorized credentials or use a secure login method.</p>
        </div>

        <div class="flex bg-black/40 rounded-xl p-1 mb-6 border border-white/5">
            <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-purple-600 text-white shadow" id="tab-passkey">PASSKEY</button>
            <button class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition" id="tab-credentials" onclick="document.getElementById('cred-form').classList.remove('hidden'); document.getElementById('passkey-form').classList.add('hidden'); this.classList.add('bg-slate-800', 'text-white'); document.getElementById('tab-passkey').classList.remove('bg-purple-600', 'text-white'); document.getElementById('tab-passkey').classList.add('text-slate-400');">CREDENTIALS</button>
        </div>

        <!-- Credentials Form -->
        <div id="cred-form" class="hidden space-y-4">
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest block mb-1">Admin Email</label>
                <input type="email" id="email" placeholder="Enter your authorized email" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500 outline-none transition text-sm font-medium">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest block mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500 outline-none transition text-sm font-medium" onkeypress="if(event.key === 'Enter') window.loginWithPassword()">
            </div>
            <button id="login-btn" onclick="window.loginWithPassword()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider text-sm shadow-lg transition flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Authenticate
            </button>
            <div class="text-center mt-4">
                <button onclick="window.resetPassword()" class="text-xs text-slate-400 hover:text-purple-400 font-bold transition">Forgot Password?</button>
            </div>
        </div>

        <!-- Passkey Form (Default) -->
        <div id="passkey-form" class="space-y-6 text-center">
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest block mb-1 text-left">Admin Email</label>
                <input type="email" id="passkey-email" placeholder="Enter your authorized email" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500 outline-none transition text-sm font-medium">
            </div>
            <p class="text-xs text-slate-400 leading-relaxed">Supports iCloud Keychain synced passkeys across all your Apple devices.</p>
            <button onclick="window.loginWithPasskey()" id="passkey-btn" class="w-full bg-purple-500 hover:bg-purple-400 text-white font-black py-4 rounded-xl uppercase tracking-wider text-sm shadow-[0_0_20px_rgba(168,85,247,0.4)] transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-fingerprint"></i> Use Passkey
            </button>
        </div>

        <div id="error-box" class="hidden mt-6 bg-red-900/30 border border-red-500/30 text-red-400 p-3 rounded-xl text-center text-xs font-bold"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Correct API Config injected directly to prevent auth/api-key-not-valid error
        const firebaseConfig = { 
            apiKey: "AIzaSyDq05wFsKLHtt8G0Z5yLOG9pIk9UX24S4o", 
            authDomain: "gctta-stats-live.firebaseapp.com", 
            projectId: "gctta-stats-live", 
            storageBucket: "gctta-stats-live.firebasestorage.app", 
            messagingSenderId: "1070856258556", 
            appId: "1:1070856258556:web:be438e04c1941abc3c6879" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.loginWithPassword = function() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const errBox = document.getElementById('error-box');
            const btn = document.getElementById('login-btn');

            if(!email || !pass) {
                errBox.innerText = "Email and Password required.";
                errBox.classList.remove('hidden');
                return;
            }

            const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;
            errBox.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, pass).then(async (result) => {
                const token = await result.user.getIdToken();
                const res = await fetch('/api/auth/google', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = data.redirect || '/admin';
                } else {
                    errBox.innerText = data.error || "Account does not have active Admin privileges.";
                    errBox.classList.remove('hidden');
                    btn.innerHTML = origText; btn.disabled = false;
                }
            }).catch(err => {
                errBox.innerText = "Incorrect credentials or account disabled.";
                errBox.classList.remove('hidden');
                btn.innerHTML = origText; btn.disabled = false;
            });
        };

        window.resetPassword = function() {
            const email = document.getElementById('email').value.trim() || document.getElementById('passkey-email').value.trim();
            if(!email) return alert("Please enter your email address first.");
            
            sendPasswordResetEmail(auth, email).then(() => {
                alert(`Password reset email sent to ${email}! Check your inbox.`);
            }).catch(err => {
                alert(`Error: ${err.message}`);
            });
        };

        // Passkey helper functions
        function _adminB64urlToUint8Array(base64url) {
            const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
            const base64 = (base64url + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }

        function _adminBufferToB64url(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
            return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        window.loginWithPasskey = async function() {
            const errBox = document.getElementById('error-box');
            errBox.classList.add('hidden');
            const email = document.getElementById('passkey-email').value.trim();
            if (!email) {
                errBox.innerText = "Please enter your admin email to use a Passkey.";
                errBox.classList.remove('hidden');
                return;
            }

            try {
                const optRes = await fetch('/api/auth/passkey/login-options', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const options = await optRes.json();
                if (options.error) throw new Error(options.error);

                const publicKey = {
                    challenge: _adminB64urlToUint8Array(options.challenge),
                    timeout: options.timeout || 60000,
                    rpId: options.rpId,
                    userVerification: options.userVerification || 'preferred'
                };
                
                if (publicKey.rpId === '127.0.0.1') publicKey.rpId = 'localhost';

                const cred = await navigator.credentials.get({ publicKey });
                if (!cred) throw new Error("Passkey login cancelled.");

                const authResponse = {
                    id: cred.id,
                    rawId: _adminBufferToB64url(cred.rawId),
                    type: cred.type,
                    response: {
                        authenticatorData: _adminBufferToB64url(cred.response.authenticatorData),
                        clientDataJSON: _adminBufferToB64url(cred.response.clientDataJSON),
                        signature: _adminBufferToB64url(cred.response.signature),
                        userHandle: cred.response.userHandle ? _adminBufferToB64url(cred.response.userHandle) : null
                    }
                };

                const verifyRes = await fetch('/api/auth/passkey/login-verify', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, auth_response: authResponse })
                });
                const resData = await verifyRes.json();
                
                if (resData.success) {
                    window.location.href = resData.redirect || '/admin';
                } else {
                    throw new Error(resData.error || "Account does not have active Admin privileges.");
                }
            } catch(e) {
                errBox.innerText = e.message;
                errBox.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
