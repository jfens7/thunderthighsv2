<div class="space-y-6">
    <div class="flex flex-wrap justify-between items-center gap-3 border-b border-white/10 pb-4">
        <div>
            <h2 class="text-purple-400 font-black uppercase tracking-widest text-lg flex items-center gap-2">
                <i class="fa-solid fa-user-astronaut"></i> Player Command Center
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">Full edit privileges: True Ratings, RC Links, Merging, and Account Deletion.</p>
        </div>
        <button type="button" onclick="window.loadPlayerDirectory()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3.5 py-2 rounded-xl border border-white/10 transition">
            <i class="fa-solid fa-rotate mr-1.5 text-sky-400"></i> Refresh Directory
        </button>
    </div>

    <!-- Search Bar -->
    <div class="bg-slate-900/90 border border-white/15 p-5 rounded-2xl shadow-xl relative">
        <label class="text-[10px] text-slate-400 uppercase font-extrabold tracking-widest block mb-2">Search Any Club Competitor</label>
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="admin-multirat-search" placeholder="Type player name (e.g. Luke Luca, Jane Lee)..." class="w-full bg-black/50 border border-white/15 text-white text-sm rounded-xl pl-11 pr-4 py-3.5 focus:border-purple-500 outline-none transition font-bold" autocomplete="off">
            <div id="admin-multirat-sugg" class="absolute z-50 left-0 right-0 top-full mt-1.5 bg-slate-900/95 backdrop-blur-xl border border-white/15 rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden custom-scrollbar"></div>
        </div>
    </div>

    <!-- Command Center Player Card -->
    <div id="admin-player-breakdown-card" class="hidden glass-panel rounded-2xl p-6 border border-purple-500/30 shadow-2xl relative overflow-hidden">
        <div class="absolute -right-16 -top-16 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <input type="hidden" id="brk-player-id">
        <input type="hidden" id="brk-player-name-hidden">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-white/10">
            <div>
                <div class="flex items-center gap-2.5">
                    <h3 id="brk-name" class="text-2xl font-black text-white">Player Name</h3>
                    <span id="brk-div-badge" class="text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/30">Div 3</span>
                </div>
                <p class="text-xs text-slate-400 mt-1">Permanent Division Bracket Cap: <span id="brk-cap-desc" class="text-white font-mono font-bold">601 - 900 (Div 3)</span></p>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="window.submitAdminPlayerOverride()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-black px-4 py-2.5 rounded-xl uppercase tracking-wider shadow transition">Apply Rating Lock</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-black/40 border border-sky-500/30 rounded-xl p-4 text-center">
                <div class="text-[10px] font-extrabold uppercase tracking-widest text-sky-400 mb-2"><i class="fa-solid fa-shield-halved mr-1"></i> Public Clamped Rating</div>
                <div id="brk-public-rating" class="text-3xl font-black text-white font-mono">865</div>
            </div>
            <div class="bg-black/40 border border-purple-500/30 rounded-xl p-4 text-center">
                <div class="text-[10px] font-extrabold uppercase tracking-widest text-purple-400 mb-2"><i class="fa-solid fa-eye mr-1"></i> Admin True Rating</div>
                <div class="flex items-center justify-center gap-2">
                    <input type="number" id="brk-input-rating" class="w-24 bg-slate-900 border border-white/10 rounded-lg px-2 py-1 text-white text-center font-mono font-bold outline-none focus:border-purple-500">
                    <span class="text-slate-500">±</span>
                    <input type="number" id="brk-input-sd" class="w-16 bg-slate-900 border border-white/10 rounded-lg px-2 py-1 text-white text-center font-mono font-bold outline-none focus:border-purple-500">
                </div>
            </div>
            <div class="bg-black/40 border border-blue-500/30 rounded-xl p-4 text-center">
                <div class="text-[10px] font-extrabold uppercase tracking-widest text-blue-400 mb-2"><i class="fa-solid fa-globe mr-1"></i> RC ID Link</div>
                <div class="flex items-center justify-center gap-2">
                    <input type="number" id="brk-rc-input" placeholder="RC ID" class="w-24 bg-slate-900 border border-white/10 rounded-lg px-2 py-1 text-white text-center font-mono font-bold outline-none focus:border-blue-500">
                    <button type="button" onclick="window.saveRCLink()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Save Link</button>
                </div>
            </div>
        </div>

        <!-- Danger Zone -->
        <div class="bg-rose-900/20 p-5 rounded-xl border border-rose-500/30 space-y-4">
            <h4 class="text-xs font-black uppercase tracking-wider text-rose-400"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Danger Zone</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-black/40 p-4 rounded-xl border border-rose-500/20">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest block mb-2">Merge Duplicate Account</label>
                    <div class="flex gap-2">
                        <input type="text" id="brk-merge-bad" placeholder="Name of duplicate to delete..." class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-white text-xs outline-none focus:border-rose-500">
                        <button type="button" onclick="window.mergePlayerDuplicate()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition whitespace-nowrap">Merge</button>
                    </div>
                </div>
                <div class="bg-black/40 p-4 rounded-xl border border-rose-500/20 flex flex-col justify-center">
                    <button type="button" onclick="window.deletePlayerPermanently()" class="w-full bg-slate-900 hover:bg-rose-600 text-rose-500 hover:text-white border border-rose-500/50 font-bold py-2.5 rounded-lg text-xs uppercase tracking-wider transition">Permanently Delete Player</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof window.loadPlayerDirectory === 'function') window.loadPlayerDirectory();
        
        const searchInput = document.getElementById('admin-multirat-search');
        const suggBox = document.getElementById('admin-multirat-sugg');
        
        if (searchInput && suggBox) {
            searchInput.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase().trim();
                if (q.length < 1) { suggBox.classList.add('hidden'); return; }
                
                const matches = (window.playerDirectoryData || []).filter(p => p.name.toLowerCase().includes(q));
                if (matches.length === 0) {
                    suggBox.innerHTML = '<div class="px-4 py-3 text-slate-400 text-xs italic">No players found</div>';
                    suggBox.classList.remove('hidden');
                    return;
                }

                suggBox.innerHTML = matches.slice(0, 10).map(p => `
                    <div class="px-4 py-3 hover:bg-purple-600/30 cursor-pointer text-sm text-white font-bold border-b border-white/5 flex justify-between items-center transition"
                         onclick="window.selectCommandCenterPlayer('${p.name.replace(/'/g, "\\'")}')">
                        <span>${p.name}</span>
                        <span class="text-xs text-purple-300 font-mono">Pub: ${p.rating} | True: ${p.true_rating}</span>
                    </div>
                `).join('');
                suggBox.classList.remove('hidden');
            });
        }
    });

    window.selectCommandCenterPlayer = function(name) {
        document.getElementById('admin-multirat-search').value = name;
        document.getElementById('admin-multirat-sugg').classList.add('hidden');
        
        const player = (window.playerDirectoryData || []).find(p => p.name.toLowerCase() === name.toLowerCase());
        if (!player) return;

        document.getElementById('brk-player-id').value = player.id;
        document.getElementById('brk-player-name-hidden').value = player.name;
        document.getElementById('brk-name').innerText = player.name;
        document.getElementById('brk-public-rating').innerText = player.rating;
        document.getElementById('brk-div-badge').innerText = player.division_cap || 'Division 3';
        document.getElementById('brk-cap-desc').innerText = player.division_cap ? `${player.division_cap}` : 'Division 3 Cap';
        document.getElementById('brk-input-rating').value = player.true_rating;
        document.getElementById('brk-input-sd').value = player.rd || 35;
        document.getElementById('brk-rc-input').value = player.rc_id || '';

        document.getElementById('admin-player-breakdown-card').classList.remove('hidden');
    };

    window.submitAdminPlayerOverride = async function() {
        const id = document.getElementById('brk-player-id').value;
        const rating = document.getElementById('brk-input-rating').value;
        const sd = document.getElementById('brk-input-sd').value;

        if (!id || !rating) return alert("Missing player or rating value.");

        try {
            const res = await fetch('/api/admin/override_rating', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_id: id, rating: rating, sd: sd, retroactive: true })
            });
            const data = await res.json();
            if (data.success) {
                alert("✅ True Rating applied successfully!");
                window.loadPlayerDirectory();
            } else { alert("❌ Failed to apply override."); }
        } catch(e) { alert("Network error."); }
    };

    window.saveRCLink = async function() {
        const name = document.getElementById('brk-player-name-hidden').value;
        const rcId = document.getElementById('brk-rc-input').value;
        if (!name) return;

        try {
            const res = await fetch('/api/admin/update_player_profile', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ player_name: name, ratings_central_id: rcId })
            });
            const data = await res.json();
            if(data.success) alert("✅ RC Link Saved! Fetching data in background.");
            else alert("❌ Failed to link.");
        } catch(e) { alert("Network error."); }
    };

    window.mergePlayerDuplicate = async function() {
        const goodName = document.getElementById('brk-player-name-hidden').value;
        const badName = document.getElementById('brk-merge-bad').value.trim();
        if(!badName || !goodName) return;
        if(!confirm(`MERGE WARNING:\n\nAre you sure you want to merge '${badName}' into '${goodName}'?\nAll matches from '${badName}' will be transferred and the duplicate will be deleted.`)) return;

        try {
            const res = await fetch('/api/admin/merge', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ good_name: goodName, bad_name: badName })
            });
            const data = await res.json();
            if(data.success) {
                alert("✅ Merge successful!");
                document.getElementById('brk-merge-bad').value = '';
                window.loadPlayerDirectory();
            } else { alert("❌ Failed to merge."); }
        } catch(e) { alert("Network error."); }
    };
</script>
