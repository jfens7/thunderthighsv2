<div id="tab-home" class="w-full flex flex-col items-center animate-fade-in relative z-10 space-y-8 pb-12">
    
    <div class="w-full max-w-6xl mx-auto mt-6 md:mt-10 px-4 flex flex-col lg:flex-row gap-6">
        
        <!-- Hero Section (Left) -->
        <div class="flex-1 bg-gradient-to-br from-blue-900 to-[#0a1122] p-8 md:p-10 rounded-3xl border border-yellow-500/30 shadow-2xl relative overflow-hidden flex flex-col justify-center">
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-950/80 border border-blue-500/30 text-3xl mb-6 shadow-lg text-yellow-400 relative z-10">
                <i class="fa-solid fa-table-tennis-paddle-ball"></i>
            </div>
            
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-white mb-4 tracking-tighter uppercase relative z-10 drop-shadow-lg leading-tight">
                GCTTA <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-200">Portal</span>
            </h1>
            
            <p class="text-sm md:text-base text-blue-200 font-medium max-w-md mb-8 relative z-10 leading-relaxed">
                Live match tracking, dynamic division standings, and deep performance analytics for Gold Coast competitors.
            </p>

            <div class="auth-logged-out flex flex-col sm:flex-row gap-3 relative z-10">
                <button onclick="window.openRegisterModal()" class="bg-gradient-to-r from-yellow-500 to-yellow-400 hover:from-yellow-400 hover:to-yellow-300 text-black font-black py-3.5 px-8 rounded-xl shadow-[0_0_20px_rgba(255,215,0,0.3)] hover:shadow-[0_0_25px_rgba(255,215,0,0.5)] transition-all uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
                <button onclick="window.toggleAuthDropdown()" class="bg-blue-950/50 hover:bg-blue-900 border border-blue-500/50 text-blue-300 hover:text-white font-bold py-3.5 px-8 rounded-xl transition-colors text-xs uppercase tracking-widest text-center">
                    Sign In
                </button>
            </div>

            <div class="auth-logged-in hidden flex-col sm:flex-row gap-3 relative z-10">
                <button onclick="window.switchTab('player-hub')" class="bg-gradient-to-r from-yellow-500 to-yellow-400 text-black font-black py-3.5 px-8 rounded-xl shadow-[0_0_20px_rgba(255,215,0,0.3)] transition-all uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rocket"></i> Enter Player Hub
                </button>
            </div>
        </div>
        
        <!-- Live Leaderboard Preview (Right) -->
        <div class="lg:w-[400px] glass-panel p-6 rounded-3xl border border-blue-500/30 shadow-xl flex flex-col relative overflow-hidden">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                <h3 class="text-base font-black text-yellow-400 uppercase tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-trophy"></i> Division 1 Top 5
                </h3>
                <button onclick="window.switchTab('week')" class="text-[10px] uppercase tracking-widest text-blue-300 font-bold hover:text-white transition-colors">
                    View All <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
            
            <div id="home-leaderboard-preview" class="flex-1 flex flex-col gap-2 relative z-10">
                <div class="text-center py-12 text-blue-400"><i class="fa-solid fa-spinner fa-spin text-3xl"></i></div>
            </div>
        </div>
    </div>
</div>

<script>
    window.loadHomeLeaderboard = async function() {
        const container = document.getElementById('home-leaderboard-preview');
        if(!container) return;
        
        let targetSeason = window.currentSeason;
        if (!targetSeason) {
            try {
                const sRes = await fetch('/api/seasons');
                const seasons = await sRes.json();
                targetSeason = seasons.filter(s => s !== "Career")[0] || "Spring 2026";
            } catch(e) { targetSeason = "Spring 2026"; }
        }

        try {
            const res = await fetch(`/api/rankings/${encodeURIComponent(targetSeason)}/Division 1`);
            let rankings = await res.json();
            rankings = rankings.filter(r => r.regular && r.regular.matches > 0).sort((a, b) => {
                const wrA = a.regular.wins / a.regular.matches;
                const wrB = b.regular.wins / b.regular.matches;
                if (wrB !== wrA) return wrB - wrA;
                return b.regular.wins - a.regular.wins;
            }).slice(0, 5);
            
            if(rankings.length === 0) {
                container.innerHTML = '<div class="text-center text-blue-300/50 text-xs py-12 font-bold uppercase tracking-widest">No matches recorded yet</div>'; 
                return;
            }
            
            container.innerHTML = rankings.map((r, i) => {
                let badge = `<div class="w-7 h-7 rounded-lg bg-black/50 text-slate-400 flex items-center justify-center font-mono font-black text-xs border border-white/10 shrink-0">${i+1}</div>`;
                if(i===0) badge = `<div class="w-7 h-7 rounded-lg bg-yellow-500 text-black flex items-center justify-center font-black text-xs shrink-0 shadow-[0_0_10px_rgba(255,215,0,0.5)]"><i class="fa-solid fa-crown"></i></div>`;
                if(i===1) badge = `<div class="w-7 h-7 rounded-lg bg-slate-300 text-black flex items-center justify-center font-mono font-black text-xs shrink-0">2</div>`;
                if(i===2) badge = `<div class="w-7 h-7 rounded-lg bg-amber-600 text-white flex items-center justify-center font-mono font-black text-xs shrink-0">3</div>`;

                return `
                <div onclick="window.loadStats('${r.name.replace(/'/g, "\\'")}')" class="flex justify-between items-center p-3 bg-black/40 hover:bg-blue-900/40 rounded-xl border border-white/5 hover:border-blue-500/30 transition-colors cursor-pointer group">
                    <div class="flex items-center gap-3 min-w-0">
                        ${badge}
                        <div class="truncate">
                            <div class="font-bold text-sm text-white group-hover:text-yellow-400 transition-colors truncate">${r.name}</div>
                            <div class="text-[10px] text-slate-400 font-mono">Rating: ${r.rating_val}</div>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-xs font-mono font-bold text-blue-300">${r.regular.wins}W - ${r.regular.losses}L</div>
                        <div class="text-[10px] font-bold text-emerald-400 mt-0.5">${Math.round((r.regular.wins/r.regular.matches)*100)}%</div>
                    </div>
                </div>`;
            }).join('');
        } catch(e) {
            container.innerHTML = '<div class="text-center text-rose-400 text-xs py-12 font-bold uppercase tracking-widest">Failed to load</div>';
        }
    }
    document.addEventListener('DOMContentLoaded', () => setTimeout(window.loadHomeLeaderboard, 500));
</script>
